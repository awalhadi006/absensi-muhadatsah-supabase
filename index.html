<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <!-- Meta Viewport untuk WebView / PWA / Android -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1f2937">

    <title>Absensi Guru</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- CSS & Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('absen_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            const metaThemeColor = document.querySelector("meta[name=theme-color]");
            if (metaThemeColor) metaThemeColor.setAttribute("content", theme === 'dark' ? "#1f2937" : "#f8fafc");
            window.addEventListener('DOMContentLoaded', () => updateThemeIcon(theme));
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('absen_theme', newTheme);
            const metaThemeColor = document.querySelector("meta[name=theme-color]");
            if (metaThemeColor) metaThemeColor.setAttribute("content", newTheme === 'dark' ? "#1f2937" : "#f8fafc");
            updateThemeIcon(newTheme);
        }
        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            if (icon) icon.className = theme === 'dark' ? 'fa-solid fa-sun text-xl opacity-70' : 'fa-solid fa-moon text-xl opacity-70';
        }
        initTheme();
    </script>
</head>

<body
    class="bg-base-200 text-base-content antialiased min-h-[100dvh] flex flex-col items-center transition-colors duration-300 relative">

    <button onclick="toggleTheme()" class="btn btn-circle btn-ghost absolute top-2 right-2 z-50">
        <i id="theme-icon" class="fa-solid fa-moon text-xl opacity-70"></i>
    </button>

    <div id="toastContainer" class="toast toast-top toast-center z-[9999] hide"></div>
    <dialog id="globalModal" class="modal modal-bottom sm:modal-middle z-[9999]">
        <div class="modal-box bg-base-100 text-base-content">
            <h3 id="modalTitle" class="font-bold text-lg text-center mb-2"></h3>
            <p id="modalMessage" class="py-4 text-center text-sm opacity-80"></p>
            <div class="modal-action justify-center gap-2" id="modalActions"></div>
        </div>
        <form method="dialog" class="modal-backdrop"><button id="modalBackdropBtn">close</button></form>
    </dialog>

    <div id="loginView" class="w-full max-w-md card bg-base-100 shadow-xl m-auto hide fade-in border border-base-300">
        <div class="card-body">
            <div class="text-center mb-4 flex flex-col items-center">
                <div class="avatar mb-4">
                    <div
                        class="w-24 h-24 rounded-full bg-base-200 shadow-sm p-1 border border-base-300 flex items-center justify-center overflow-hidden">
                        <img src="logo.png" alt="Logo" class="object-contain w-full h-full"
                            onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=BA&background=10b981&color=fff';" />
                    </div>
                </div>
                <h1 class="text-2xl font-bold">Sistem Absensi</h1>
                <p class="text-sm opacity-70">Guru Muhadatsah</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div class="form-control">
                    <label
                        class="input input-bordered bg-base-200 focus-within:border-success focus-within:ring-1 focus-within:ring-success flex items-center gap-3 transition-colors">
                        <i class="fa-solid fa-user opacity-50"></i>
                        <input type="text" id="username" class="grow bg-transparent" placeholder="Username" required />
                    </label>
                </div>
                <!-- FITUR MATA (EYE ICON) PASSWORD -->
                <div class="form-control relative">
                    <label
                        class="input input-bordered bg-base-200 focus-within:border-success focus-within:ring-1 focus-within:ring-success flex items-center gap-3 pr-10 transition-colors">
                        <i class="fa-solid fa-lock opacity-50"></i>
                        <input type="password" id="password" class="grow bg-transparent" placeholder="Password"
                            required />
                    </label>
                    <button type="button" onclick="togglePassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 opacity-50 hover:opacity-100 p-2 cursor-pointer text-base-content">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <button type="submit" id="btnLogin"
                    class="btn btn-success bg-emerald-500 hover:bg-emerald-600 w-full mt-4 text-white border-0 shadow-md">
                    <span>Masuk</span><span id="loginLoader" class="loading loading-spinner loading-sm hide"></span>
                </button>
            </form>
        </div>
    </div>

    <div id="dashboardView" class="w-full max-w-md flex-1 flex flex-col hide pt-12 pb-4 px-4 fade-in">
        <div
            class="flex justify-between items-center bg-base-100 p-4 rounded-2xl shadow-sm mb-4 border border-base-300">
            <div>
                <p class="text-[10px] opacity-70 uppercase tracking-wider font-bold">Petugas Aktif</p>
                <h2 id="userNameDisplay" class="text-base font-bold text-success leading-tight">Admin</h2>
            </div>
            <div class="flex gap-2 items-center">
                <div id="networkIndicator"
                    class="badge badge-success bg-emerald-500 gap-1 text-white text-xs border-0 py-3 shadow-sm cursor-pointer"
                    onclick="forceSync()">
                    <i class="fa-solid fa-wifi"></i> <span id="offlineCount">Online</span>
                </div>
                <button onclick="logout()" class="btn btn-square btn-error btn-outline btn-sm shadow-sm"><i
                        class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="showScanner()" 
            class="btn btn-success bg-emerald-500 hover:bg-emerald-600 h-auto py-5 flex flex-col gap-2 rounded-2xl shadow-md border-0 text-white">
                <i class="fa-solid fa-qrcode text-3xl"></i><span class="font-bold text-sm">Scan QR</span>
            </button>
            <button onclick="showManual()" 
            class="btn h-auto py-5 flex flex-col gap-2 rounded-2xl shadow-sm bg-base-100 border-2 border-base-300 hover:border-success hover:bg-success hover:text-white transition-all text-base-content">
                <i class="fa-solid fa-list-check text-3xl"></i><span class="font-bold text-sm">Manual & Bulk</span>
            </button>
        </div>

        <!-- TAMBAHAN TOMBOL REKAPAN DI DASHBOARD -->
        <!-- Tombol Rekapan disembunyikan sesuai permintaan -->
        <!-- 
        <button onclick="showRekap()" 
        class="btn btn-info bg-blue-500 hover:bg-blue-600 text-white w-full mb-4 border-0 shadow-md rounded-2xl flex items-center justify-center gap-2">
            <i class="fa-solid fa-clipboard-list text-xl"></i><span class="font-bold text-sm">Lihat Rekapan Guru</span>
        </button> 
        -->
        
        <!-- Menambahkan cursor-pointer, hover, dan onclick untuk Filter -->
        <div class="grid grid-cols-4 gap-2 mb-4 text-center">
            <div onclick="filterDashboardList('hadir')" class="bg-base-100 rounded-xl p-2 border border-base-300 shadow-sm cursor-pointer hover:bg-emerald-50 transition-colors">
                <div class="text-xl font-bold text-success" id="statHadir">0</div>
                <div class="text-[10px] opacity-70">Hadir</div>
            </div>
            <div onclick="filterDashboardList('izin')" class="bg-base-100 rounded-xl p-2 border border-base-300 shadow-sm cursor-pointer hover:bg-blue-50 transition-colors">
                <div class="text-xl font-bold text-info" id="statIzin">0</div>
                <div class="text-[10px] opacity-70">Izin</div>
            </div>
            <div onclick="filterDashboardList('sakit')" class="bg-base-100 rounded-xl p-2 border border-base-300 shadow-sm cursor-pointer hover:bg-yellow-50 transition-colors">
                <div class="text-xl font-bold text-warning" id="statSakit">0</div>
                <div class="text-[10px] opacity-70">Sakit</div>
            </div>
            <div onclick="filterDashboardList('alfa')" class="bg-base-100 rounded-xl p-2 border border-base-300 shadow-sm cursor-pointer hover:bg-red-50 transition-colors">
                <div class="text-xl font-bold text-error" id="statAlfa">0</div>
                <div class="text-[10px] opacity-70">Alfa</div>
            </div>
        </div>

        <div class="card bg-base-100 shadow-sm flex-1 border border-base-300 overflow-hidden flex flex-col">
            <div class="bg-base-200 px-4 py-3 flex justify-between items-center border-b border-base-300">
                <h3 class="font-bold text-sm">Status Guru Hari Ini</h3>
                <div class="flex items-center gap-2">
                    <span class="badge badge-sm badge-neutral font-medium" id="statBelum">0 Belum</span>
                </div>
            </div>
            <div id="smartListContainer" class="list-guru-container p-2 space-y-2 relative min-h-[150px]">
                <div class="flex items-center justify-center h-full w-full text-xs opacity-50 absolute inset-0"><span
                        class="loading loading-spinner loading-md mr-2"></span> Memuat server...</div>
            </div>
        </div>
    </div>

    <div id="scannerView" class="w-full max-w-md flex-1 flex flex-col justify-center hide fade-in px-4">
        <div class="card bg-base-100 shadow-xl border border-base-300">
            <div class="card-body p-4 relative" id="readerContainer">
                <h2 class="font-bold text-center mb-3 text-lg">Scan QR Code</h2>
                <div class="relative rounded-xl overflow-hidden mb-3 bg-base-200">
                    <div id="reader" class="w-full relative"></div>
                </div>
                <p class="text-xs text-center opacity-70 mb-4">Kamera siap. Arahkan ke QR Code.</p>
                <button onclick="stopScanner(); goBack()" class="btn btn-error text-white w-full border-0 shadow-md"><i
                        class="fa-solid fa-times mr-2"></i> Tutup Scanner</button>
            </div>
        </div>
    </div>

    <div id="manualView" class="w-full max-w-md flex-1 flex flex-col hide pt-4 pb-4 px-4 fade-in">
        <div class="card bg-base-100 shadow-xl flex-1 flex flex-col overflow-hidden border border-base-300">
            <div class="p-4 border-b border-base-300 flex items-center justify-center bg-base-200 relative">
                <button onclick="goBack()" class="btn btn-sm btn-ghost btn-circle absolute left-2"><i
                        class="fa-solid fa-arrow-left text-lg"></i></button>
                <h2 class="font-bold text-lg">Input Manual</h2>
            </div>

            <div class="p-3 border-b border-base-300 space-y-3 bg-base-100">
                <div class="flex flex-wrap gap-2 items-center">
                    <button type="button" onclick="toggleFilter('ikhwan', this)"
                        class="btn btn-xs btn-outline border-base-300 rounded-full filter-btn">Ikhwan</button>
                    <button type="button" onclick="toggleFilter('akhwat', this)"
                        class="btn btn-xs btn-outline border-base-300 rounded-full filter-btn">Akhwat</button>
                    <button type="button" onclick="toggleFilter('ust', this)"
                        class="btn btn-xs btn-outline border-base-300 rounded-full filter-btn">Ust</button>
                    <button type="button" onclick="toggleFilter('usth', this)"
                        class="btn btn-xs btn-outline border-base-300 rounded-full filter-btn">Usth</button>
                    <button type="button" onclick="toggleFilter('akh', this)"
                        class="btn btn-xs btn-outline border-base-300 rounded-full filter-btn">Akh</button>
                    <button type="button" onclick="toggleFilter('ukh', this)"
                        class="btn btn-xs btn-outline border-base-300 rounded-full filter-btn">Ukh</button>
                    <button type="button" onclick="filterSelect('clear')"
                        class="btn btn-xs btn-error text-white border-0 shadow-sm rounded-full ml-auto">Reset</button>
                </div>
                <input type="text" id="searchManual" oninput="searchChecklist()"
                    class="input input-sm input-bordered bg-base-200 focus:border-success focus:ring-1 focus:ring-success w-full transition-colors"
                    placeholder="Cari nama manual...">
            </div>

            <div class="flex-1 overflow-y-auto p-2 bg-base-100" id="checklistContainer">
                <div class="text-center text-xs opacity-50 mt-4"><span
                        class="loading loading-spinner loading-xs"></span> Memuat daftar guru...</div>
            </div>

            <div class="p-4 bg-base-200 border-t border-base-300">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm font-semibold opacity-70">Terpilih: <span id="selectedCount"
                            class="text-success font-bold">0</span></span>
                </div>
                
                <!-- INPUT TANGGAL (Opsional untuk backdate) -->
                <div class="form-control mb-3">
                    <label class="label p-0 pb-1"><span class="label-text text-xs font-bold opacity-70">Tanggal Absen (Kosongkan jika hari ini):</span></label>
                    <input type="date" id="manualDate" class="input input-sm input-bordered bg-base-100 text-sm w-full transition-colors focus:border-success" />
                </div>

                <div class="grid grid-cols-2 gap-2 mb-2">
                    <label
                        class="flex items-center gap-2 bg-base-100 p-2 border border-base-300 rounded cursor-pointer hover:border-success transition-colors"><input
                            type="radio" name="bulkStatus" value="Hadir" class="radio radio-success radio-sm" checked
                            onchange="toggleBulkAlasan()"> <span class="text-sm font-medium">Hadir</span></label>
                    <label
                        class="flex items-center gap-2 bg-base-100 p-2 border border-base-300 rounded cursor-pointer hover:border-error transition-colors"><input
                            type="radio" name="bulkStatus" value="Tidak Hadir" class="radio radio-error radio-sm"
                            onchange="toggleBulkAlasan()"> <span class="text-sm font-medium">Absen</span></label>
                </div>
                <select id="bulkAlasan" class="select select-bordered select-error select-sm w-full mb-3 hide text-sm bg-base-100">
                    <option value="" disabled selected>Pilih Alasan Absen</option>
                    <option value="Sakit">Sakit</option>
                    <option value="Izin">Izin</option>
                    <option value="Alfa">Alfa</option>
                </select>
                <button onclick="submitBulk()" id="btnBulk" class="btn btn-success bg-emerald-500 hover:bg-emerald-600 text-white shadow-md border-0 w-full">Kirim Data Terpilih</button>
            </div>
        </div>
    </div>

    <!-- VIEW BARU: REKAPAN GURU -->
    <div id="rekapView" class="w-full max-w-md flex-1 flex flex-col hide pt-4 pb-4 px-4 fade-in">
        <div class="card bg-base-100 shadow-xl flex-1 flex flex-col overflow-hidden border border-base-300">
            <!-- Header Halaman -->
            <div class="p-4 border-b border-base-300 flex items-center justify-center bg-base-200 relative">
                <button onclick="goBack()" class="btn btn-sm btn-ghost btn-circle absolute left-2"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                <h2 class="font-bold text-lg">Rekapan Absensi</h2>
            </div>
            
            <!-- Area Filter Tanggal -->
            <div class="p-3 bg-base-100 border-b border-base-300 space-y-2">
                <div class="grid grid-cols-2 gap-2">
                    <div class="form-control">
                        <label class="label p-1"><span class="label-text text-xs font-bold">Mulai Tanggal</span></label>
                        <input type="date" id="startDate" class="input input-sm input-bordered bg-base-200 text-xs w-full" />
                    </div>
                    <div class="form-control">
                        <label class="label p-1"><span class="label-text text-xs font-bold">Sampai Tanggal</span></label>
                        <input type="date" id="endDate" class="input input-sm input-bordered bg-base-200 text-xs w-full" />
                    </div>
                </div>
                <button onclick="fetchRekapData()" id="btnFilterRekap" class="btn btn-info btn-sm bg-blue-500 hover:bg-blue-600 w-full text-white border-0 shadow-sm">
                    <i class="fa-solid fa-filter"></i> Tampilkan Rekapan
                </button>
            </div>

            <!-- Tempat Data Akan Ditampilkan -->
            <div class="flex-1 overflow-y-auto p-3 bg-base-200 space-y-2" id="rekapContainer">
                <div class="text-center text-sm opacity-50 mt-10">
                    <i class="fa-solid fa-calendar-days text-3xl mb-2"></i><br>
                    Pilih tanggal dan tekan Tampilkan.
                </div>
            </div>
        </div>
    </div>

    <!-- 1. Panggil library Supabase dulu -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Panggil api.js (karena butuh library Supabase) -->
    <script src="assets/js/api.js"></script>
    <!-- 3. Panggil app.js (berisi logika tampilan yang nanti kita pisah) -->
    <script src="assets/js/app.js"></script>
</body>

</html>
